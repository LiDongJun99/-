<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 坦克大战 - Tank Battle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    user-select: none;
  }
  .game-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 780px;
    color: #eee;
    font-size: 18px;
    font-weight: bold;
  }
  .header-item {
    background: #16213e;
    padding: 8px 18px;
    border-radius: 8px;
    border: 2px solid #0f3460;
  }
  .header-item.score { color: #f5c518; }
  .header-item.lives { color: #e94560; }
  .header-item.kills { color: #53d769; }
  canvas {
    border: 3px solid #0f3460;
    border-radius: 8px;
    background: #0a0a0a;
    image-rendering: pixelated;
  }
  .controls-info {
    color: #888;
    font-size: 13px;
    text-align: center;
    line-height: 1.6;
  }
  .controls-info span { color: #f5c518; }
  .game-over-overlay {
    position: absolute;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: rgba(0,0,0,0.85);
    border: 2px solid #e94560;
    border-radius: 16px;
    padding: 40px 60px;
    color: #fff;
  }
  .game-over-overlay h1 {
    font-size: 48px;
    color: #e94560;
    text-shadow: 0 0 20px #e94560;
  }
  .game-over-overlay .final-score {
    font-size: 24px;
    color: #f5c518;
  }
  .restart-btn {
    padding: 12px 36px;
    font-size: 20px;
    font-weight: bold;
    background: #e94560;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    transition: all 0.2s;
  }
  .restart-btn:hover {
    background: #ff6b81;
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(233,69,96,0.5);
  }
</style>
</head>
<body>
<div class="game-wrapper">
  <div class="game-header">
    <div class="header-item score">🏆 得分: <span id="score">0</span></div>
    <div class="header-item kills">💥 击杀: <span id="kills">0</span></div>
    <div class="header-item lives">❤️ 生命: <span id="lives">3</span></div>
  </div>
  <div style="position: relative;">
    <canvas id="gameCanvas" width="780" height="600"></canvas>
    <div class="game-over-overlay" id="gameOver">
      <h1>GAME OVER</h1>
      <div class="final-score">最终得分: <span id="finalScore">0</span></div>
      <button class="restart-btn" onclick="restartGame()">🔄 再来一局</button>
    </div>
  </div>
  <div class="controls-info">
    <span>W A S D</span> 或 <span>↑ ← ↓ →</span> 移动 &nbsp;|&nbsp; <span>空格</span> 发射子弹 &nbsp;|&nbsp; <span>P</span> 暂停
  </div>
</div>

<script>
// ==================== 游戏引擎 ====================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;
const TILE = 30; // 每个格子 30px

// 游戏状态
let score = 0;
let kills = 0;
let lives = 3;
let gameRunning = true;
let gamePaused = false;
let frameCount = 0;

// 输入
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === 'p') {
    gamePaused = !gamePaused;
  }
  e.preventDefault();
});
window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
  e.preventDefault();
});

// 地图: 0=空地, 1=砖墙(可破坏), 2=钢墙(不可破坏)
const MAP_COLS = 26; // 780 / 30
const MAP_ROWS = 20; // 600 / 30
const map = [];

function generateMap() {
  for (let r = 0; r < MAP_ROWS; r++) {
    map[r] = [];
    for (let c = 0; c < MAP_COLS; c++) {
      // 边界是钢墙
      if (r === 0 || r === MAP_ROWS - 1 || c === 0 || c === MAP_COLS - 1) {
        map[r][c] = 2;
      } else {
        map[r][c] = 0;
      }
    }
  }

  // 生成随机砖墙和钢墙
  for (let r = 1; r < MAP_ROWS - 1; r++) {
    for (let c = 1; c < MAP_COLS - 1; c++) {
      const rand = Math.random();
      if (rand < 0.12) {
        map[r][c] = 1; // 砖墙
      } else if (rand < 0.17) {
        map[r][c] = 2; // 钢墙
      }
    }
  }

  // 清除玩家出生点周围 (左下角)
  const clearZone = (cr, cc, radius) => {
    for (let r = cr - radius; r <= cr + radius; r++) {
      for (let c = cc - radius; c <= cc + radius; c++) {
        if (r >= 1 && r < MAP_ROWS - 1 && c >= 1 && c < MAP_COLS - 1) {
          map[r][c] = 0;
        }
      }
    }
  };
  clearZone(MAP_ROWS - 3, 3, 2); // 玩家出生点
  clearZone(2, MAP_COLS - 4, 2); // 敌人生成点1
  clearZone(2, 3, 2);            // 敌人生成点2
  clearZone(2, MAP_COLS / 2 | 0, 2); // 敌人生成点3
}

// ==================== 坦克类 ====================
class Tank {
  constructor(x, y, color, isPlayer = false) {
    this.x = x;           // 像素坐标 (中心)
    this.y = y;
    this.width = 26;
    this.height = 26;
    this.speed = isPlayer ? 2.5 : 1.2;
    this.dir = 'up';      // up, down, left, right
    this.color = color;
    this.isPlayer = isPlayer;
    this.bullets = [];
    this.cooldown = 0;
    this.cooldownMax = isPlayer ? 20 : 80;
    this.alive = true;
    this.respawnTimer = 0;
    this.flashTimer = 0;
  }

  getBounds() {
    return {
      left: this.x - this.width / 2,
      right: this.x + this.width / 2,
      top: this.y - this.height / 2,
      bottom: this.y + this.height / 2,
    };
  }

  collidesWithWall(dx, dy) {
    const b = this.getBounds();
    const newLeft = b.left + dx;
    const newRight = b.right + dx;
    const newTop = b.top + dy;
    const newBottom = b.bottom + dy;

    // 检查四角
    const corners = [
      { x: newLeft, y: newTop },
      { x: newRight, y: newTop },
      { x: newLeft, y: newBottom },
      { x: newRight, y: newBottom },
    ];

    for (const corner of corners) {
      const col = Math.floor(corner.x / TILE);
      const row = Math.floor(corner.y / TILE);
      if (row >= 0 && row < MAP_ROWS && col >= 0 && col < MAP_COLS) {
        if (map[row][col] > 0) return true;
      }
    }
    return false;
  }

  collidesWithTank(other) {
    if (!other.alive || !this.alive) return false;
    const a = this.getBounds();
    const b = other.getBounds();
    return !(a.right <= b.left || a.left >= b.right ||
             a.bottom <= b.top || a.top >= b.bottom);
  }

  move(dx, dy, enemies) {
    if (!this.alive) return;
    // 分别检测 X 和 Y 轴，允许沿墙滑动
    if (!this.collidesWithWall(dx, 0)) {
      const newBounds = this.getBounds();
      newBounds.left += dx;
      newBounds.right += dx;
      let blocked = false;
      for (const e of enemies) {
        if (e === this || !e.alive) continue;
        const eb = e.getBounds();
        if (!(newBounds.right <= eb.left || newBounds.left >= eb.right ||
              newBounds.bottom <= eb.top || newBounds.top >= eb.bottom)) {
          blocked = true;
          break;
        }
      }
      if (!blocked) this.x += dx;
    }
    if (!this.collidesWithWall(0, dy)) {
      const newBounds = this.getBounds();
      newBounds.top += dy;
      newBounds.bottom += dy;
      let blocked = false;
      for (const e of enemies) {
        if (e === this || !e.alive) continue;
        const eb = e.getBounds();
        if (!(newBounds.right <= eb.left || newBounds.left >= eb.right ||
              newBounds.bottom <= eb.top || newBounds.top >= eb.bottom)) {
          blocked = true;
          break;
        }
      }
      if (!blocked) this.y += dy;
    }
    // 保持在边界内
    this.x = Math.max(this.width/2, Math.min(W - this.width/2, this.x));
    this.y = Math.max(this.height/2, Math.min(H - this.height/2, this.y));
  }

  shoot() {
    if (!this.alive || this.cooldown > 0) return;
    const b = this.getBounds();
    let bx = this.x, by = this.y;
    const offset = this.width / 2 + 2;
    switch (this.dir) {
      case 'up':    by = b.top - 4; break;
      case 'down':  by = b.bottom + 4; break;
      case 'left':  bx = b.left - 4; break;
      case 'right': bx = b.right + 4; break;
    }
    this.bullets.push(new Bullet(bx, by, this.dir, this.isPlayer));
    this.cooldown = this.cooldownMax;
  }

  update(enemies) {
    if (!this.alive) {
      this.respawnTimer--;
      return;
    }
    if (this.cooldown > 0) this.cooldown--;
    if (this.flashTimer > 0) this.flashTimer--;

    // 更新子弹
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      this.bullets[i].update();
      if (this.bullets[i].dead) {
        this.bullets.splice(i, 1);
      }
    }
  }

  draw(ctx) {
    if (!this.alive) return;
    if (this.flashTimer > 0 && this.flashTimer % 4 < 2) return; // 闪烁

    ctx.save();
    ctx.translate(this.x, this.y);

    // 旋转
    const angles = { up: 0, right: Math.PI / 2, down: Math.PI, left: -Math.PI / 2 };
    ctx.rotate(angles[this.dir]);

    const hw = this.width / 2;
    const hh = this.height / 2;

    // 履带
    ctx.fillStyle = '#2d2d2d';
    ctx.fillRect(-hw, -hh, 6, this.height);      // 左履带
    ctx.fillRect(hw - 6, -hh, 6, this.height);    // 右履带

    // 履带纹理
    ctx.fillStyle = '#1a1a1a';
    for (let i = -hh + 3; i < hh; i += 6) {
      ctx.fillRect(-hw, i, 6, 2);
      ctx.fillRect(hw - 6, i, 6, 2);
    }

    // 车身
    const bodyColor = this.isPlayer ? '#4ecb71' : this.color;
    const bodyDark = this.isPlayer ? '#2d9d4e' : this.color.replace('e9', 'c0').replace('53', '30').replace('f5', 'd0');
    ctx.fillStyle = bodyColor;
    ctx.fillRect(-hw + 7, -hh + 3, this.width - 14, this.height - 6);

    // 车身高光
    ctx.fillStyle = this.isPlayer ? '#7df0a0' : 'rgba(255,255,255,0.2)';
    ctx.fillRect(-hw + 9, -hh + 4, 8, this.height - 10);

    // 炮塔
    ctx.fillStyle = bodyDark;
    ctx.beginPath();
    ctx.arc(0, 0, 7, 0, Math.PI * 2);
    ctx.fill();

    // 炮管
    ctx.fillStyle = '#ddd';
    ctx.fillRect(-2, -hh, 4, hh - 8);

    // 炮管高光
    ctx.fillStyle = '#fff';
    ctx.fillRect(-1, -hh, 2, hh - 10);

    ctx.restore();

    // 绘制子弹
    for (const bullet of this.bullets) {
      bullet.draw(ctx);
    }
  }
}

// ==================== 子弹类 ====================
class Bullet {
  constructor(x, y, dir, isPlayer) {
    this.x = x;
    this.y = y;
    this.dir = dir;
    this.speed = 5;
    this.size = 4;
    this.isPlayer = isPlayer;
    this.dead = false;
    this.trail = [];
  }

  update() {
    this.trail.push({ x: this.x, y: this.y, life: 4 });
    if (this.trail.length > 5) this.trail.shift();
    for (const t of this.trail) t.life--;

    switch (this.dir) {
      case 'up':    this.y -= this.speed; break;
      case 'down':  this.y += this.speed; break;
      case 'left':  this.x -= this.speed; break;
      case 'right': this.x += this.speed; break;
    }

    // 出界
    if (this.x < 0 || this.x > W || this.y < 0 || this.y > H) {
      this.dead = true;
      return;
    }

    // 撞墙
    const col = Math.floor(this.x / TILE);
    const row = Math.floor(this.y / TILE);
    if (row >= 0 && row < MAP_ROWS && col >= 0 && col < MAP_COLS) {
      if (map[row][col] === 1) { // 砖墙：破坏
        map[row][col] = 0;
        this.dead = true;
        spawnExplosion(this.x, this.y, 'small');
      } else if (map[row][col] === 2) { // 钢墙：反弹（不穿透）
        this.dead = true;
        spawnExplosion(this.x, this.y, 'tiny');
      }
    }
  }

  draw(ctx) {
    // 拖尾
    for (const t of this.trail) {
      const alpha = t.life / 5;
      ctx.fillStyle = this.isPlayer
        ? `rgba(255, 255, 100, ${alpha * 0.5})`
        : `rgba(255, 100, 100, ${alpha * 0.5})`;
      ctx.beginPath();
      ctx.arc(t.x, t.y, this.size * 0.6, 0, Math.PI * 2);
      ctx.fill();
    }
    // 子弹本体
    ctx.fillStyle = this.isPlayer ? '#ffe600' : '#ff4444';
    ctx.shadowColor = this.isPlayer ? '#ffe600' : '#ff4444';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

// ==================== 爆炸效果 ====================
const explosions = [];
function spawnExplosion(x, y, type) {
  const count = type === 'big' ? 20 : type === 'small' ? 10 : 5;
  const life = type === 'big' ? 30 : type === 'small' ? 15 : 8;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    explosions.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life,
      maxLife: life,
      color: Math.random() < 0.5 ? '#ff6b35' : '#f5c518',
    });
  }
}

function updateExplosions() {
  for (let i = explosions.length - 1; i >= 0; i--) {
    const e = explosions[i];
    e.x += e.vx;
    e.y += e.vy;
    e.life--;
    if (e.life <= 0) explosions.splice(i, 1);
  }
}

function drawExplosions(ctx) {
  for (const e of explosions) {
    const alpha = e.life / e.maxLife;
    ctx.fillStyle = e.color.replace(')', `, ${alpha})`).replace('#', 'rgba(');
    // 简化颜色处理
    const r = parseInt(e.color.slice(1,3), 16);
    const g = parseInt(e.color.slice(3,5), 16);
    const b = parseInt(e.color.slice(5,7), 16);
    ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.beginPath();
    ctx.arc(e.x, e.y, 3 * alpha, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ==================== 粒子效果 ====================
const particles = [];
function spawnParticles(x, y, count, color) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.5 + Math.random() * 2;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 15 + Math.random() * 15,
      maxLife: 30,
      color,
    });
  }
}

// ==================== 游戏初始化 ====================
let player;
let enemies = [];

function initGame() {
  score = 0;
  kills = 0;
  lives = 3;
  gameRunning = true;
  gamePaused = false;
  frameCount = 0;
  explosions.length = 0;
  particles.length = 0;

  generateMap();
  player = new Tank(3 * TILE + TILE/2, (MAP_ROWS - 3) * TILE + TILE/2, '#4ecb71', true);

  enemies = [
    new Tank((MAP_COLS - 4) * TILE + TILE/2, 2 * TILE + TILE/2, '#e94560'),
    new Tank(3 * TILE + TILE/2, 2 * TILE + TILE/2, '#e94560'),
    new Tank((MAP_COLS/2|0) * TILE + TILE/2, 2 * TILE + TILE/2, '#f5712e'),
  ];

  document.getElementById('gameOver').style.display = 'none';
  updateUI();
}

// ==================== AI ====================
function aiUpdate(enemy, index) {
  if (!enemy.alive) return;

  // 每 60 帧随机改变方向
  if (frameCount % 60 === index * 20) {
    const dirs = ['up', 'down', 'left', 'right'];
    enemy.dir = dirs[Math.floor(Math.random() * 4)];
  }

  // 偶尔朝玩家方向射击
  if (player.alive && Math.random() < 0.015) {
    const dx = player.x - enemy.x;
    const dy = player.y - enemy.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      enemy.dir = dx > 0 ? 'right' : 'left';
    } else {
      enemy.dir = dy > 0 ? 'down' : 'up';
    }
    enemy.shoot();
  } else if (Math.random() < 0.008) {
    enemy.shoot();
  }

  // 移动
  const speed = enemy.speed;
  let dx = 0, dy = 0;
  switch (enemy.dir) {
    case 'up':    dy = -speed; break;
    case 'down':  dy = speed; break;
    case 'left':  dx = -speed; break;
    case 'right': dx = speed; break;
  }

  // 如果前方有障碍，换方向
  if (enemy.collidesWithWall(dx, dy)) {
    const dirs = ['up', 'down', 'left', 'right'];
    enemy.dir = dirs[Math.floor(Math.random() * 4)];
    return;
  }

  const allTanks = [player, ...enemies];
  enemy.move(dx, dy, allTanks);
}

// ==================== 碰撞检测 ====================
function checkBulletHits() {
  // 玩家子弹打敌人
  for (const bullet of player.bullets) {
    if (bullet.dead) continue;
    for (const enemy of enemies) {
      if (!enemy.alive) continue;
      const eb = enemy.getBounds();
      if (bullet.x > eb.left && bullet.x < eb.right &&
          bullet.y > eb.top && bullet.y < eb.bottom) {
        bullet.dead = true;
        enemy.alive = false;
        enemy.respawnTimer = 180; // 3秒后重生
        enemy.bullets.length = 0;
        spawnExplosion(enemy.x, enemy.y, 'big');
        kills++;
        score += 100;
        updateUI();
      }
    }
  }

  // 敌人子弹打玩家
  if (!player.alive) return;
  for (const enemy of enemies) {
    if (!enemy.alive) continue;
    for (const bullet of enemy.bullets) {
      if (bullet.dead) continue;
      const pb = player.getBounds();
      if (bullet.x > pb.left && bullet.x < pb.right &&
          bullet.y > pb.top && bullet.y < pb.bottom) {
        bullet.dead = true;
        spawnExplosion(player.x, player.y, 'big');
        lives--;
        score = Math.max(0, score - 50);
        updateUI();
        if (lives <= 0) {
          player.alive = false;
          gameOver();
        } else {
          player.flashTimer = 90;
          // 重生到安全位置
          player.x = 3 * TILE + TILE/2;
          player.y = (MAP_ROWS - 3) * TILE + TILE/2;
          player.bullets.length = 0;
        }
      }
    }
  }

  // 坦克碰撞伤害（碰到敌人坦克）
  if (player.alive && player.flashTimer <= 0) {
    for (const enemy of enemies) {
      if (!enemy.alive) continue;
      if (player.collidesWithTank(enemy)) {
        spawnExplosion(player.x, player.y, 'small');
        lives--;
        score = Math.max(0, score - 50);
        updateUI();
        if (lives <= 0) {
          player.alive = false;
          gameOver();
        } else {
          player.flashTimer = 120;
          player.x = 3 * TILE + TILE/2;
          player.y = (MAP_ROWS - 3) * TILE + TILE/2;
          player.bullets.length = 0;
        }
      }
    }
  }
}

// ==================== 敌人生成 ====================
function respawnEnemies() {
  for (const enemy of enemies) {
    if (!enemy.alive && enemy.respawnTimer <= 0) {
      const spawns = [
        { x: (MAP_COLS - 4) * TILE + TILE/2, y: 2 * TILE + TILE/2 },
        { x: 3 * TILE + TILE/2, y: 2 * TILE + TILE/2 },
        { x: (MAP_COLS/2|0) * TILE + TILE/2, y: 2 * TILE + TILE/2 },
      ];
      // 找个远离玩家的出生点
      let best = spawns[Math.floor(Math.random() * spawns.length)];
      let bestDist = 0;
      if (player.alive) {
        for (const s of spawns) {
          const dist = Math.hypot(player.x - s.x, player.y - s.y);
          if (dist > bestDist) { bestDist = dist; best = s; }
        }
      }
      enemy.x = best.x;
      enemy.y = best.y;
      enemy.alive = true;
      enemy.bullets.length = 0;
    }
  }
}

// ==================== 游戏循环 ====================
function update() {
  if (!gameRunning || gamePaused) return;
  frameCount++;

  // 每 500 帧加 10 分（存活奖励）
  if (frameCount % 300 === 0) {
    score += 10;
    updateUI();
  }

  // 玩家输入
  if (player.alive) {
    let dx = 0, dy = 0;
    const speed = player.speed;
    if (keys['w'] || keys['arrowup'])    { dy = -speed; player.dir = 'up'; }
    else if (keys['s'] || keys['arrowdown']) { dy = speed; player.dir = 'down'; }
    else if (keys['a'] || keys['arrowleft']) { dx = -speed; player.dir = 'left'; }
    else if (keys['d'] || keys['arrowright']) { dx = speed; player.dir = 'right'; }

    if (dx !== 0 || dy !== 0) {
      player.move(dx, dy, enemies);
    }

    if (keys[' '] || keys['spacebar']) {
      player.shoot();
    }
  }

  // 更新所有单位
  player.update(enemies);
  for (let i = 0; i < enemies.length; i++) {
    enemies[i].update(enemies);
    aiUpdate(enemies[i], i);
  }

  // 碰撞检测
  checkBulletHits();

  // 敌人生成
  respawnEnemies();

  // 更新特效
  updateExplosions();
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // 更新击杀计数，敌人生成越多（保持3个敌人）
  // 如果敌人全死，加快生成长
  for (const enemy of enemies) {
    if (!enemy.alive) enemy.respawnTimer = Math.max(0, enemy.respawnTimer - 2);
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // 绘制地图
  for (let r = 0; r < MAP_ROWS; r++) {
    for (let c = 0; c < MAP_COLS; c++) {
      const x = c * TILE;
      const y = r * TILE;
      if (map[r][c] === 1) {
        // 砖墙
        ctx.fillStyle = '#b5651d';
        ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = '#8b4513';
        ctx.fillRect(x, y, TILE, TILE/2);
        ctx.fillRect(x + TILE/2, y + TILE/2, TILE, TILE/2);
        ctx.strokeStyle = '#654321';
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, TILE - 1, TILE - 1);
        // 砖纹
        ctx.beginPath();
        ctx.moveTo(x, y + TILE/2);
        ctx.lineTo(x + TILE, y + TILE/2);
        ctx.stroke();
      } else if (map[r][c] === 2) {
        // 钢墙
        ctx.fillStyle = '#5a5a5a';
        ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = '#7a7a7a';
        ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
        ctx.fillStyle = '#4a4a4a';
        ctx.fillRect(x + 6, y + 6, TILE - 12, TILE - 12);
        // 铆钉
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.arc(x + 6, y + 6, 2, 0, Math.PI * 2);
        ctx.arc(x + TILE - 6, y + 6, 2, 0, Math.PI * 2);
        ctx.arc(x + 6, y + TILE - 6, 2, 0, Math.PI * 2);
        ctx.arc(x + TILE - 6, y + TILE - 6, 2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // 空地 - 暗色地面
        ctx.fillStyle = '#111';
        ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = '#0d0d0d';
        ctx.fillRect(x + 1, y + 1, TILE - 2, TILE - 2);
      }
    }
  }

  // 绘制玩家坦克
  player.draw(ctx);

  // 绘制敌方坦克
  for (const enemy of enemies) {
    enemy.draw(ctx);
  }

  // 绘制爆炸
  drawExplosions(ctx);

  // 绘制粒子
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    const r = parseInt(p.color.slice(1,3), 16);
    const g = parseInt(p.color.slice(3,5), 16);
    const b = parseInt(p.color.slice(5,7), 16);
    ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2 * alpha, 0, Math.PI * 2);
    ctx.fill();
  }

  // 暂停提示
  if (gamePaused) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px "Courier New"';
    ctx.textAlign = 'center';
    ctx.fillText('⏸ 暂停中', W/2, H/2);
    ctx.textAlign = 'start';
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function gameOver() {
  gameRunning = false;
  document.getElementById('finalScore').textContent = score;
  document.getElementById('gameOver').style.display = 'flex';
}

function restartGame() {
  initGame();
}

function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('kills').textContent = kills;
  document.getElementById('lives').textContent = '❤️'.repeat(Math.max(0, lives));
}

// ==================== 启动 ====================
initGame();
gameLoop();
</script>
</body>
</html>
